<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>实时对话联调台</title>
<style>
  :root { color-scheme: light dark; --fg:#1b1b1f; --mut:#6b6b76; --line:#d8d8e0;
          --hi:#2f6f5e; --warn:#a5482f; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8ec; --mut:#9a9aa6;
          --line:#33333c; --hi:#67c2a8; --warn:#e08b6f; } }
  body { font:15px/1.7 -apple-system,"PingFang SC",sans-serif; color:var(--fg);
         margin:36px auto; max-width:880px; padding:0 20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.hint { color:var(--mut); margin:0 0 18px; }
  button { font:inherit; font-size:14px; padding:8px 14px; border-radius:9px;
           border:1px solid var(--line); background:transparent; color:var(--fg);
           cursor:pointer; margin-right:8px; }
  button:hover:not(:disabled), button.on { border-color:var(--hi); color:var(--hi); }
  button:disabled { opacity:.45; cursor:default; }
  .run { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .pulse { width:9px; height:9px; border-radius:50%; background:var(--line); }
  .pulse.on { background:var(--hi); animation:b 1.1s ease-in-out infinite; }
  .pulse.talk { background:var(--warn); }
  @keyframes b { 0%,100%{opacity:.35} 50%{opacity:1} }
  .meter { height:6px; background:var(--line); border-radius:3px; overflow:hidden;
           margin:0 0 14px; }
  .meter > i { display:block; height:100%; width:0; background:var(--hi); }
  .cfg { display:flex; gap:18px; align-items:center; flex-wrap:wrap; font-size:13px;
         color:var(--mut); margin:0 0 18px; }
  .cfg label { display:flex; align-items:center; gap:6px; }
  .cfg input[type=range] { width:120px; accent-color:var(--hi); }
  .cfg select { font-size:13px; padding:3px 6px; }
  #dialog { min-height:220px; border:1px solid var(--line); border-radius:12px;
            padding:16px 18px; margin-bottom:16px; }
  .turn { margin:0 0 12px; }
  .turn .who { font-size:12px; color:var(--mut); letter-spacing:.04em; }
  .turn.me .say { color:var(--fg); }
  .turn.her .say { color:var(--hi); }
  .interim { color:var(--mut); font-style:italic; }
  .meta { font:12px ui-monospace,Menlo,monospace; color:var(--mut); margin-top:6px; }
  pre { font:11px/1.5 ui-monospace,Menlo,monospace; background:rgba(127,127,127,.09);
        padding:10px 12px; border-radius:8px; height:150px; overflow:auto; margin:0; }
</style>

<h1>实时对话联调台</h1>
<p class="hint">麦克风 20 ms 一块 → 流式识别（边说边出字）→ 回复 → 流式合成（首包即播）。
说一句完整的话就会触发回复；她说话时你直接开口，会立刻停声并取消合成。
需要 <code>localhost</code>（麦克风权限与 AudioWorklet 都要求安全上下文）。</p>

<div class="run">
  <button id="start">开始对话</button>
  <button id="stop" disabled>结束</button>
  <span class="pulse" id="dot"></span>
  <span id="state" class="hint" style="margin:0">未连接</span>
  <span id="mode" class="hint" style="margin:0 0 0 auto;display:none"></span>
</div>
<div class="meter"><i id="level"></i></div>

<div class="cfg" id="cfg" hidden>
  <label>音色
    <select id="voice">
      <option value="B">红红</option>
      <option value="01">小卡</option>
      <option value="13">小U</option>
    </select>
  </label>
  <label>语速
    <input id="rate" type="range" min="0.85" max="1.1" step="0.01" value="0.90">
    <span id="rateval">0.90</span>
  </label>
  <label><input id="auto" type="checkbox" checked> 跟着你说得快慢走</label>
  <span id="ratereason" class="hint" style="margin:0"></span>
</div>

<div id="dialog"></div>
<pre id="log"></pre>

<script type="module">
import { startCapture, createPlayer } from "/web/audio/index.js";
import { bytesToBase64 } from "/web/audio/pcm.js";

const $ = (id) => document.getElementById(id);
const logBox = $("log");
const dialog = $("dialog");
const log = (...a) => { logBox.textContent += a.join(" ") + "\n"; logBox.scrollTop = logBox.scrollHeight; };
const setState = (t, talk = false) => {
  $("state").textContent = t;
  $("dot").className = "pulse" + (talk ? " talk" : " on");
};

let sid = null, es = null, stopCapture = null, activeTurn = null;
let myTurnEl = null, myInterimEl = null;

const player = createPlayer({
  onPlayback(turnId, sentenceId, state, tMs) {
    log(`[playback] ${turnId}/${sentenceId} ${state} @${tMs}`);
    if (state === "started") setState("她在说", true);
    if (state === "ended" || state === "cancelled") { activeTurn = null; setState("听着"); }
  },
  onLevel(_t, _s, level) { $("level").style.width = Math.round(level * 100) + "%"; },
});

function addTurn(who, text) {
  const el = document.createElement("div");
  el.className = "turn " + who;
  el.innerHTML = `<div class="who">${who === "me" ? "你" : "红红"}</div><div class="say"></div>`;
  el.querySelector(".say").textContent = text;
  dialog.appendChild(el);
  dialog.scrollTop = dialog.scrollHeight;
  return el;
}

const api = (path, body) => fetch(`${path}?sid=${sid}`, {
  method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify(body ?? {}),
});

/* ---------------- 音色 / 语速 ---------------- */

function sendCfg(obj) {
  if (!sid) return;
  fetch(`/config?sid=${sid}`, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify(obj) }).catch(() => {});
}
$("voice").onchange = () => {
  sendCfg({ voice: $("voice").value });
  log("[cfg] 音色 → " + $("voice").selectedOptions[0].textContent);
};
$("rate").oninput = () => { $("rateval").textContent = (+$("rate").value).toFixed(2); };
$("rate").onchange = () => sendCfg({ rate: +$("rate").value });
$("auto").onchange = () => {
  sendCfg({ auto: $("auto").checked });
  log("[cfg] 跟随语速 " + ($("auto").checked ? "开" : "关"));
};

$("start").onclick = async () => {
  $("start").disabled = true;
  try {
    await player.unlock();
    const info = await (await fetch("/open", { method: "POST" })).json();
    sid = info.sid;
    log("[open] session " + sid + "  asr=" + info.asr_model + "  tts=" + info.tts);
    $("mode").style.display = "";
    $("mode").textContent = `识别 ${info.asr_model} · 配音 ${info.tts === "cloud" ? "云端复刻" : "本地成品"}`;
    $("cfg").hidden = false;
    $("voice").value = info.voice;
    $("rate").value = info.rate;
    $("rateval").textContent = (+info.rate).toFixed(2);
    $("auto").checked = info.auto;

    es = new EventSource(`/events?sid=${sid}`);
    es.onmessage = (e) => onEvent(JSON.parse(e.data));
    es.onerror = () => log("[sse] 断开");

    if (new URLSearchParams(location.search).has("selftest")) {
      // 不碰麦克风：灌 1.5 秒 220Hz 正弦（当作"你说话了"）+ 1 秒静音，
      // 验证"上行→识别→合成→下行→播放"整条链。纯静音不会触发任何回复。
      log("[selftest] 不开麦克风，灌 1.5 秒测试音 + 1 秒静音");
      const total = 16000 * 2.5;
      const buf = new Int16Array(total);
      for (let n = 0; n < total; n++) {
        const t = n / 16000;
        buf[n] = t < 1.5 ? Math.round(Math.sin(2 * Math.PI * 220 * t) * 9000) : 0;
      }
      let i = 0;
      const timer = setInterval(() => {
        const piece = buf.subarray(i * 320, (i + 1) * 320);
        api("/uplink", { seq: i, t_ms: i * 20, sample_rate: 16000, codec: "pcm_s16le",
                         data: bytesToBase64(new Uint8Array(piece.buffer)) }).catch(() => {});
        if (++i >= total / 320) { clearInterval(timer); log("[selftest] 灌完"); }
      }, 20);
    } else {
      stopCapture = await startCapture({
        onAudio(frame) {
          api("/uplink", frame).catch(() => {});
        },
        onInterrupt(turnId) {
          log(`[barge-in] ${turnId}`);
          player.stopTurn(turnId);
          api("/cancel").catch(() => {});
          activeTurn = null;
          setState("听着（你开口了）");
        },
        getActiveTurn: () => activeTurn,
      });
    }

    $("stop").disabled = false;
    setState("听着");
  } catch (err) {
    log("[error] " + err.message);
    $("start").disabled = false;
  }
};

function onEvent(ev) {
  switch (ev.type) {
    case "transcript": {
      if (!myTurnEl) { myTurnEl = addTurn("me", ""); myInterimEl = myTurnEl.querySelector(".say"); }
      myInterimEl.textContent = ev.text;
      myInterimEl.className = ev.is_final ? "say" : "say interim";
      if (ev.is_final) { myTurnEl = null; myInterimEl = null; }
      break;
    }
    case "reply.text": {
      const el = addTurn("her", ev.text);
      el.querySelector(".say").dataset.turn = ev.turn_id;
      setState("她在说", true);
      break;
    }
    case "reply.audio": {
      activeTurn = ev.turn_id;
      player.queueAudio(ev);
      break;
    }
    case "rate":
      $("rateval").textContent = (+ev.user).toFixed(2);
      $("ratereason").textContent = `实际 ${ev.value}` + (ev.reason ? " · " + ev.reason : "");
      break;
    case "latency":
      log(`[latency] 首包 ${ev.first_packet_ms} ms（${ev.turn_id}）`);
      break;
    case "state":
      log(`[state] ${ev.turn_id} → ${ev.state}`);
      break;
    case "error":
      log(`[error] ${ev.turn_id}: ${ev.message}`);
      break;
  }
}

$("stop").onclick = async () => {
  $("stop").disabled = true;
  await stopCapture?.(); stopCapture = null;
  es?.close(); es = null;
  if (sid) { await api("/close").catch(() => {}); sid = null; }
  player.dispose();
  setState("已结束");
  $("dot").className = "pulse";
  $("start").disabled = false;
};

window.addEventListener("pagehide", () => { stopCapture?.(); es?.close(); player.dispose(); });

// ?selftest=1 时自动开始，方便无头浏览器一键验证整条链
if (new URLSearchParams(location.search).has("selftest")) setTimeout(() => $("start").click(), 60);
</script>
</html>
