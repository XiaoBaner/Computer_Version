<!doctype html><meta charset="utf-8"><title>web/audio 冒烟测试</title>
<!-- 无头浏览器里跑：检查 pcm 的往返、重采样长度、切块与 player 接口。
     用法：Chrome --headless=new --dump-dom http://localhost:8000/web/audio/smoke.html -->
<pre id="out">running</pre>
<script type="module">
import * as pcm from "./pcm.js";
import { createPlayer } from "./index.js";
const L = [];
const ok = (n, c, x="") => L.push(`${c?"PASS":"FAIL"} ${n} ${x}`);
try {
  const f32 = new Float32Array([0, 0.5, -0.5, 0.25]);
  const i16 = pcm.float32ToInt16(f32);
  const back = pcm.int16ToFloat32(i16);
  ok("int16 往返", Math.max(...[...back].map((v,i)=>Math.abs(v-f32[i]))) < 1e-3, [...i16].join(","));
  const b64 = pcm.bytesToBase64(new Uint8Array(i16.buffer));
  const rt = new Uint8Array(pcm.base64ToBytes(b64));
  ok("base64 往返", rt.length===i16.byteLength && b64.length>0, b64.slice(0,12));
  const rs = new pcm.Resampler(48000, 16000);
  const src = new Float32Array(48000).map((_,i)=>Math.sin(2*Math.PI*440*i/48000));
  let n = 0; for (let i=0;i<48000;i+=1024) n += rs.process(src.subarray(i,i+1024)).length;
  ok("48k→16k 长度", Math.abs(n-16000)<40, n);
  const fr = new pcm.Framer(320);
  const frames = fr.push(new Float32Array(800));
  const tail = fr.flush();
  ok("切块 800→2 块+尾块", frames.length===2 && frames.every(f=>f.length===320) && tail.length===320, frames.length);
  ok("rms 静态", pcm.rmsOf(new Float32Array(320))===0 && Math.abs(pcm.rmsOf(new Float32Array(320).fill(1))-1)<1e-6);
  const p = createPlayer({});
  ok("player 接口", ["queueAudio","stopTurn","stopAll","dispose","unlock"].every(k=>typeof p[k]==="function"));
  p.queueAudio({turn_id:"R1",sentence_id:"S1",seq:0,sample_rate:24000,codec:"pcm_s16le",data:"AAAA",is_last:true});
  ok("坏块不抛错", true);
} catch (e) { L.push("ERROR " + (e && e.stack ? e.stack.split("\n")[0] : e)); }
document.getElementById("out").textContent = L.join("\n");
</script>
