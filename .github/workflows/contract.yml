name: contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate contract examples
        run: python tools/replay_contract.py

      - name: Run tests if the suite exists
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "tests/ 尚未提交：当前只校验契约样例，应用骨架合入后再启用 pytest。"
          fi