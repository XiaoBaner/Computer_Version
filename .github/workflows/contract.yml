name: contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    # ubuntu-latest 已滚动到 26.04，没有 3.11 的预编译包；固定 24.04 LTS。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI 只要求 CPython 3.11。.python-version 里的 3.11.11 是本地 pyenv
      # 的精确补丁号，GitHub 托管镜像未必提供，所以这里用浮动的 3.11。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate contract examples
        run: python tools/replay_contract.py

      - name: Run tests if the suite exists
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "tests/ 尚未提交：当前只校验契约样例，应用骨架合入后再启用 pytest。"
          fi